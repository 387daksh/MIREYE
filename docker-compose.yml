services:
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_BASEMAP_STYLE_URL: ${NEXT_PUBLIC_BASEMAP_STYLE_URL:-}
        NEXT_PUBLIC_BASEMAP_FALLBACK_STYLE_URL: ${NEXT_PUBLIC_BASEMAP_FALLBACK_STYLE_URL:-}
    environment: { NEXT_PUBLIC_API_URL: http://localhost:8000, HOSTNAME: 0.0.0.0 }
    ports: ["3000:3000"]
    depends_on: { api: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ >/dev/null"], interval: 10s, timeout: 5s, retries: 12 }
  api:
    restart: unless-stopped
    build: .
    command: sh -c "alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_ENV: development
      CORS_ORIGINS: '["http://localhost:3000"]'
      DATABASE_URL: postgresql+psycopg://mireye:mireye@postgres:5432/mireye
      ARTIFACT_STORE_BACKEND: s3
      WORLD_ASSET_DIR: /data/world-assets
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: mireye-world
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      TEMPORAL_TARGET: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: mireye
      WORKFLOW_BACKEND: temporal
      MIREYE_API_KEY: ${MIREYE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports: ["8000:8000"]
    volumes: ["api_data:/data"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      temporal: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"], interval: 10s, timeout: 5s, retries: 18 }
  worker:
    restart: unless-stopped
    build: .
    command: python scripts/temporal_worker.py
    environment:
      DATABASE_URL: postgresql+psycopg://mireye:mireye@postgres:5432/mireye
      NATS_URL: nats://nats:4222
      NATS_STREAM: MIREYE
      TEMPORAL_TARGET: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: mireye
      WORKFLOW_BACKEND: temporal
      REDIS_URL: redis://redis:6379/0
      ARTIFACT_STORE_BACKEND: s3
      WORLD_ASSET_DIR: /data/world-assets
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: mireye-world
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      MIREYE_API_KEY: ${MIREYE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on: { api: { condition: service_healthy }, temporal: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health/ready')"], interval: 10s, timeout: 5s, retries: 12 }
  event-publisher:
    restart: unless-stopped
    build: .
    command: python scripts/event_worker.py
    environment:
      DATABASE_URL: postgresql+psycopg://mireye:mireye@postgres:5432/mireye
      NATS_URL: nats://nats:4222
      NATS_STREAM: MIREYE
    depends_on: { api: { condition: service_healthy }, postgres: { condition: service_healthy }, nats: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health/ready')"], interval: 10s, timeout: 5s, retries: 12 }
  event-consumer:
    restart: unless-stopped
    build: .
    command: python scripts/event_consumer.py
    environment:
      DATABASE_URL: postgresql+psycopg://mireye:mireye@postgres:5432/mireye
      NATS_URL: nats://nats:4222
      NATS_STREAM: MIREYE
    depends_on: { api: { condition: service_healthy }, postgres: { condition: service_healthy }, nats: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/health/ready')"], interval: 10s, timeout: 5s, retries: 12 }
  postgres:
    restart: unless-stopped
    build: ./infra/postgres
    environment: { POSTGRES_DB: mireye, POSTGRES_USER: mireye, POSTGRES_PASSWORD: mireye }
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mireye -d mireye"], interval: 5s, timeout: 5s, retries: 12 }
  redis:
    restart: unless-stopped
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 12 }
  nats:
    restart: unless-stopped
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports: ["4222:4222", "8222:8222"]
    volumes: ["nats_data:/data"]
    healthcheck: { test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz >/dev/null"], interval: 5s, timeout: 3s, retries: 12 }
  temporal:
    restart: unless-stopped
    image: temporalio/auto-setup:1.27.2
    environment: { DB: postgres12, DB_PORT: 5432, POSTGRES_SEEDS: postgres, POSTGRES_USER: mireye, POSTGRES_PWD: mireye }
    ports: ["7233:7233"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"], interval: 10s, timeout: 5s, retries: 30 }
  temporal-ui:
    restart: unless-stopped
    image: temporalio/ui:2.34.0
    environment: { TEMPORAL_ADDRESS: temporal:7233 }
    ports: ["8080:8080"]
    depends_on: { temporal: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null"], interval: 10s, timeout: 5s, retries: 18 }
  minio:
    restart: unless-stopped
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null"], interval: 5s, timeout: 5s, retries: 12 }
  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/mireye-world"]
volumes: { api_data: {}, postgres_data: {}, minio_data: {}, nats_data: {} }
